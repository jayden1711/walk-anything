[project]
name = "walk-anything"
version = "0.0.1"
description = "Describe a robot body in words; one shared policy makes it walk."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy", "mujoco", "torch", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["walk_anything"]

[tool.pytest.ini_options]
testpaths = ["tests"]
